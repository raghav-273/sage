<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"></head>
<body style="font-family:Arial,sans-serif;font-size:14px;color:#1f2d3d;background:#f4f5f7;margin:0;padding:32px 0;">
  <table width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table width="560" style="background:#fff;border:1px solid #dee2e6;border-radius:4px;padding:40px;">
      <tr><td>
        <p style="font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:#94a3b8;margin-bottom:8px;">SAGE — Standards and Guidelines Engine</p>
        <h1 style="font-size:20px;color:#1f2d3d;margin-bottom:24px;font-weight:700;">Verify Your Email Address</h1>
        <p>Hello <strong>{{ username }}</strong>,</p>
        <p>Thank you for registering for SAGE. Click below to verify your email address.</p>
        <p style="margin:28px 0;">
          <a href="{{ verification_url }}"
             style="background:#1f2d3d;color:#fff;padding:12px 24px;text-decoration:none;border-radius:4px;font-weight:600;font-size:13px;">
            Verify Email Address
          </a>
        </p>
        <p style="color:#64748b;font-size:12px;">This link expires in 48 hours. If you did not register for SAGE, no action is required.</p>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
